# nginx: serve the app's service worker at the storefront root.
#
# Only for a store whose domain already points at an nginx you run, which
# reverse-proxies the storefront to Shopify. Put this inside that server { }
# block, above the catch-all `location /`.
#
# Served from /sw.js the worker's default scope is "/", so Shopify stripping
# Service-Worker-Allowed from the app proxy no longer matters. It is still set
# here for completeness.

location = /sw.js {
    # Fetch the real, per-shop file through Shopify's app proxy.
    proxy_pass              https://shops.myshopify.com/apps/pwa/sw.js;
    proxy_set_header        Host $host;             # Shopify routes by Host...
    proxy_ssl_server_name   on;
    proxy_ssl_name          $host;                  # ...and by SNI.
    proxy_set_header        Accept-Encoding "";
    proxy_set_header        Cookie "";

    proxy_hide_header       Set-Cookie;
    proxy_hide_header       Cache-Control;
    proxy_hide_header       Content-Type;

    add_header              Content-Type "application/javascript; charset=utf-8" always;
    add_header              Service-Worker-Allowed "/" always;
    add_header              X-PWA-Root-Worker "1" always;
    add_header              Cache-Control "no-cache, must-revalidate" always;
    add_header              X-Content-Type-Options "nosniff" always;
}
